  <text x="410" y="20" class="term-title" text-anchor="middle">terminal - teste de erro: dispositivo não suportado</text>
  <text x="20" y="52" class="term-text" fill="#4fc1ff">$ python3 -c &#x27;</text>
  <text x="20" y="70" class="term-text" fill="#e0e0e0">  import socket</text>
  <text x="20" y="88" class="term-text" fill="#e0e0e0">  from Message import MessageRegister, ReceiveMessage</text>
  <text x="20" y="106" class="term-text" fill="#e0e0e0">  from Device import Device</text>
  <text x="20" y="124" class="term-text" fill="#e0e0e0">  s = socket.socket()</text>
  <text x="20" y="142" class="term-text" fill="#e0e0e0">  s.connect((&quot;localhost&quot;, 5000))</text>
  <text x="20" y="160" class="term-text" fill="#e0e0e0">  dev = Device(s, 99) # Tipo 99: NÃO SUPORTADO</text>
  <text x="20" y="178" class="term-text" fill="#e0e0e0">  s.send(MessageRegister().pack(99))</text>
  <text x="20" y="196" class="term-text" fill="#e0e0e0">  resp = ReceiveMessage(s, dev)</text>
  <text x="20" y="214" class="term-text" fill="#e0e0e0">  print(&quot;Resposta do servidor:&quot;, resp.toStringMsg())</text>
  <text x="20" y="232" class="term-text" fill="#e0e0e0">  s.close()</text>
  <text x="20" y="250" class="term-text" fill="#e0e0e0">&#x27;</text>
  <text x="20" y="268" class="term-text" fill="#e0e0e0"></text>
  <text x="20" y="286" class="term-text" fill="#e0e0e0">[CLIENTE] Enviando registro com tipo = 99 (Dispositivo Não Suportado)...</text>
  <text x="20" y="304" class="term-text" fill="#ff7b72">[CLIENTE] Resposta do servidor: Dispositivo: 0, Status: [5] Tipo de dispositivo não suportado</text>
  <text x="20" y="322" class="term-text" fill="#e0e0e0">[CLIENTE] Conexão encerrada pelo servidor.</text>
  <text x="20" y="340" class="term-text" fill="#e0e0e0"></text>
  <text x="20" y="358" class="term-text" fill="#e0e0e0">--- Log no Terminal do Servidor ---</text>
  <text x="20" y="376" class="term-text" fill="#e0e0e0">Cliente conectado: (&#x27;127.0.0.1&#x27;, 49822)</text>
  <text x="20" y="394" class="term-text" fill="#e0e0e0">Conectado:  (&#x27;127.0.0.1&#x27;, 49822)</text>
